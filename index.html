<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ส่งต่อ · ส่งไฟล์ข้ามเครื่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ff;--ink:#1a1745;--mut:#6a6794;--card:#fff;--line:#e1ddf7;--ac:#5b3df5;--acink:#fff;--ok:#1fc99a;--bad:#e5484d;--bl:88%;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d0b22;--ink:#ecebff;--mut:#9d9ac7;--card:#171436;--line:#2a2658;--ac:#8a73ff;--acink:#0d0b22;--ok:#4de0b6;--bad:#ff7b80;--bl:30%;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg) radial-gradient(520px 360px at 90% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent) no-repeat;color:var(--ink);font:400 16px/1.55 Prompt,system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:600;font-size:1.5rem}
button{font:inherit;color:inherit;cursor:pointer}
.me{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 8px}
.me span:first-child{font-size:1.3rem}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;margin:20px 0 8px}
.seg i{position:absolute;inset:4px 50% 4px 4px;background:var(--ac);border-radius:99px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.seg[data-t=qr] i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;background:none;border:0;font-weight:500;padding:9px;color:var(--mut);transition:color .2s}
.seg button.on{color:var(--acink)}
.radar{position:relative;aspect-ratio:1;max-width:400px;margin:8px auto}
.ring{position:absolute;border:1.5px solid var(--line);border-radius:50%}
.r1{inset:0}.r2{inset:16%}.r3{inset:32%}
.pulse{position:absolute;inset:36%;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:pulse 2.8s ease-out infinite}
.pulse+.pulse{animation-delay:1.4s}
@keyframes pulse{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.7);opacity:0}}
.you{position:absolute;inset:38%;display:grid;place-items:center;font-size:2.2rem;background:var(--card);border:2px solid var(--ac);border-radius:50%;box-shadow:0 6px 24px color-mix(in srgb,var(--ac) 30%,transparent)}
.bubble{position:absolute;left:var(--x);top:var(--y);translate:-50% -50%;width:84px;background:none;border:0;padding:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bubble>span{display:grid;justify-items:center;gap:2px;animation:bob 4s ease-in-out infinite}
.bubble b{display:grid;place-items:center;width:58px;height:58px;font-size:1.9rem;border-radius:50%;background:hsl(var(--h) 80% var(--bl));border:2px solid var(--card);box-shadow:0 4px 14px rgba(40,20,120,.2)}
.bubble em{font-style:normal;font-size:.8rem;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble.wait b{animation:wig .6s ease-in-out infinite;outline:3px dashed var(--ac);outline-offset:3px}
@keyframes pop{from{scale:0;opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wig{25%{rotate:-8deg}75%{rotate:8deg}}
.hint{text-align:center;color:var(--mut);margin:4px 16px 0;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:12px}
.card h2{font-size:1.05rem;font-weight:600;margin:0 0 4px}
.card p{margin:0 0 14px;color:var(--mut);font-size:.92rem}
.pri,.sec{width:100%;padding:13px;border-radius:12px;font-weight:500;border:1px solid var(--line);background:var(--card)}
.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.pri:active,.sec:active{transform:scale(.97)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);margin:16px 0;font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.join{display:flex;gap:8px}
input{font:inherit;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px}
#code{flex:1;text-align:center;letter-spacing:.3em;font-weight:600;font-size:1.2rem;text-transform:uppercase}
.join .pri{width:auto;padding:0 22px}
.code{font-size:2.6rem;font-weight:600;letter-spacing:.18em;text-align:center}
.qr{width:210px;margin:12px auto;background:#fff;padding:12px;border-radius:16px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.qr svg{display:block;width:100%;height:auto}
.peerbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:20px}
.peerbar>b{font-size:2rem;font-weight:400}
.peerbar div{flex:1;min-width:0}.peerbar strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peerbar small{display:flex;align-items:center;gap:6px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.peerbar button{border:1px solid var(--line);background:none;border-radius:10px;padding:7px 12px;font-size:.85rem}
.drop{display:grid;place-items:center;gap:4px;text-align:center;margin-top:14px;padding:34px 16px;border:2px dashed var(--ac);border-radius:20px;color:var(--ac);font-weight:500;cursor:pointer;transition:background .2s,scale .2s}
.drop span{font-size:2.4rem;line-height:1}.drop.over{background:color-mix(in srgb,var(--ac) 12%,transparent);scale:1.02}
.drop small{color:var(--mut);font-weight:400}
.item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;animation:pop .35s ease both}
.item>b{grid-row:span 3;font-size:1.4rem;font-weight:400;align-self:center}
.item .n{display:flex;justify-content:space-between;gap:10px;font-weight:500}.item .n span:first-child{word-break:break-all}
.item .n span:last-child,.item .st{color:var(--mut);font-size:.85rem;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px;transition:width .15s linear}
.act{display:flex;gap:8px}.act:empty{display:none}.act>*{padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:inherit;font-size:.9rem}
.act .y{background:var(--ac);color:var(--acink);border-color:var(--ac)}
dialog{border:0;border-radius:22px;padding:22px;width:min(88vw,360px);background:var(--card);color:var(--ink);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
dialog::backdrop{background:rgba(13,11,34,.55);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 4px}dialog p{margin:0 0 14px;color:var(--mut)}dialog input{width:100%;margin-bottom:14px}
dialog .row{display:flex;gap:8px}dialog .row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
dialog .row .y{background:var(--ac);color:var(--acink);border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center;font-size:.92rem}
#toast.on{opacity:1;translate:-50% 0}
#fx span{position:fixed;left:50%;bottom:22%;font-size:1.6rem;pointer-events:none;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#fx{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">ส่งต่อ</div>
    <button class="me" id="me" aria-label="เปลี่ยนชื่อเครื่องนี้"><span id="me-av"></span><span id="me-name"></span></button>
  </header>

  <nav class="seg" id="seg" data-t="near">
    <i></i><button data-t="near" class="on">ใกล้ฉัน</button><button data-t="qr">QR Code</button>
  </nav>

  <!-- จับคู่ใน Wi-Fi เดียวกัน -->
  <section id="v-near">
    <div class="radar">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="pulse"></div><div class="pulse"></div>
      <div class="you" id="you"></div>
      <div id="peers"></div>
    </div>
    <p class="hint" id="near-msg" aria-live="polite"></p>
  </section>

  <!-- QR Code / รหัสห้อง -->
  <section id="v-qr" hidden>
    <div class="card" id="qr-home">
      <h2>ใช้ได้ทุกเครือข่าย</h2>
      <p>เหมาะเมื่อสองเครื่องอยู่คนละ Wi-Fi หรือมือถือใช้เน็ตเครือข่ายมือถือ</p>
      <button class="pri" id="b-host">สร้างห้องและแสดง QR</button>
      <div class="or">หรือ</div>
      <div class="join">
        <input id="code" maxlength="6" placeholder="รหัส 6 ตัว" autocomplete="off" autocapitalize="characters" aria-label="รหัสห้อง">
        <button class="pri" id="b-join">เข้าร่วม</button>
      </div>
    </div>
    <div class="card" id="qr-host" hidden>
      <h2>ให้อีกเครื่องสแกน QR นี้</h2>
      <p>หรือเปิดเว็บนี้บนอีกเครื่องแล้วกรอกรหัสด้านล่าง</p>
      <div class="qr" id="h-qr"></div>
      <div class="code" id="h-code"></div>
    </div>
  </section>

  <!-- ส่งไฟล์ -->
  <section id="v-link" hidden>
    <div class="peerbar">
      <b id="l-av"></b>
      <div><strong id="l-name"></strong><small><i class="dot" id="l-dot"></i><span id="l-st"></span></small></div>
      <button id="bye">ตัดการเชื่อมต่อ</button>
    </div>
    <label class="drop" id="drop" tabindex="0">
      <span>📤</span>แตะเพื่อเลือกไฟล์ หรือลากมาวาง
      <small>ส่งได้หลายไฟล์พร้อมกัน</small>
      <input type="file" id="file" multiple hidden>
    </label>
    <div id="list"></div>
  </section>
</div>

<dialog id="dlg"><form method="dialog">
  <h3 id="d-t"></h3><p id="d-p"></p><input id="d-i" maxlength="20">
  <div class="row"><button value="n" id="d-no"></button><button value="y" id="d-yes" class="y"></button></div>
</form></dialog>
<div id="toast" role="status"></div>
<div id="fx" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s), SLOTS = 8, CHUNK = 65536, MAXBUF = 4194304;
const AV = ['🦊','🐼','🐙','🦄','🐸','🐯','🦉','🐳','🐧','🦋'];
const NM = ['แมวส้ม','หมีน้อย','ปลาวาฬ','กระต่าย','นกฮูก','เพนกวิน','จิ้งจอก','แพนด้า'];
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd = a => a[Math.random() * a.length | 0];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hue = s => Math.abs([...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % 360;
const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';

let me = {};
try { me = JSON.parse(localStorage.getItem('me')) || {}; } catch {}
if (!me.name) { me = { name: rnd(NM) + (10 + Math.random() * 90 | 0), av: rnd(AV) }; save(); }
function save() { try { localStorage.setItem('me', JSON.stringify(me)); } catch {} }
function paintMe() { $('#me-av').textContent = $('#you').textContent = me.av; $('#me-name').textContent = me.name; }

let mode = '', peer = null, active = null, slot = 0, scanT = 0, pre = '', hostConn = null, wl = null;
const peers = {}, conns = {}, out = {}, inc = {};

/* ---------- UI ตัวช่วย ---------- */
const show = v => { ['near', 'qr', 'link'].forEach(x => $('#v-' + x).hidden = x !== v); $('#seg').hidden = v === 'link'; };
let tt = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); }
const msg = t => $('#near-msg').textContent = t;
function burst() {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.textContent = rnd(['🎉', '✨', '💜', '⭐', '🟣']);
    s.style.setProperty('--dx', (Math.random() * 260 - 130) + 'px');
    s.style.setProperty('--dy', -(120 + Math.random() * 200) + 'px');
    s.style.animationDelay = Math.random() * .15 + 's';
    $('#fx').append(s); setTimeout(() => s.remove(), 1500);
  }
}
function ask(t, p, yes, no, inp) {
  const d = $('#dlg');
  if (d.open) return Promise.resolve(false);
  return new Promise(r => {
    $('#d-t').textContent = t; $('#d-p').textContent = p || '';
    const i = $('#d-i'); i.hidden = inp == null; i.value = inp || '';
    i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); d.close('y'); } };
    const n = $('#d-no'); n.hidden = !no; n.textContent = no || ''; $('#d-yes').textContent = yes;
    d.onclose = () => r(d.returnValue === 'y' ? (inp != null ? i.value.trim() : true) : false);
    d.showModal();
  });
}
async function keepAwake() { try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && active) keepAwake(); });

/* ---------- เริ่ม/หยุด ---------- */
function stop() {
  clearInterval(scanT);
  Object.keys(peers).forEach(k => { peers[k].el.remove(); delete peers[k]; });
  Object.keys(conns).forEach(k => delete conns[k]);
  if (peer) { try { peer.destroy(); } catch {} peer = null; }
  mode = ''; hostConn = null;
}
function tab(t) {
  stop(); $('#seg').dataset.t = t;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  show(t); $('#qr-home').hidden = false; $('#qr-host').hidden = true;
  if (t === 'near') near();
}

/* ---------- โหมด "ใกล้ฉัน" (Wi-Fi เดียวกัน) ---------- */
async function near() {
  mode = 'near'; msg('กำลังค้นหาอุปกรณ์…');
  let key;
  try {
    const ip = (await (await fetch('/api/ip', { cache: 'no-store' })).json()).ip;
    const net = ip.includes(':') ? ip.split(':').slice(0, 4).join(':') : ip; // IPv6 ใช้เฉพาะส่วนเครือข่าย
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('songto|' + net));
    key = [...new Uint8Array(h)].slice(0, 6).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { if (mode === 'near') msg('โหมดนี้ต้อง deploy บน Vercel (มี /api/ip) จึงจะใช้ได้'); return; }
  if (mode !== 'near') return;
  pre = 'lan-' + key + '-'; claim(0);
}
function claim(i) {
  if (i >= SLOTS) { msg('มีอุปกรณ์ในเครือข่ายนี้เต็มแล้ว'); return; }
  const p = new Peer(pre + i);
  p.on('open', () => {
    if (mode !== 'near') { p.destroy(); return; }
    peer = p; slot = i; scanT = setInterval(scan, 3000); scan(); lay();
  });
  p.on('connection', wire);
  p.on('error', e => {
    if (e.type === 'unavailable-id') { p.destroy(); if (mode === 'near') claim(i + 1); }
    else if (e.type !== 'peer-unavailable') toast('ผิดพลาด: ' + e.type);
  });
}
function scan() { // เชื่อมต่อไปยังช่องที่ใหญ่กว่าเรา แต่ละคู่จึงมีการเชื่อมต่อเดียว
  if (!peer || active) return;
  for (let j = slot + 1; j < SLOTS; j++) {
    const o = conns[j];
    if (o && (o.open || Date.now() - o._t < 6000)) continue;
    if (o) try { o.close(); } catch {}
    const c = peer.connect(pre + j, { reliable: true }); c._t = Date.now(); conns[j] = c; wire(c);
  }
}
function addBubble(c) {
  if (peers[c.peer]) peers[c.peer].el.remove();
  const el = document.createElement('button'); el.className = 'bubble'; el.style.setProperty('--h', hue(c.info.name));
  el.innerHTML = '<span><b></b><em></em></span>';
  el.querySelector('b').textContent = c.info.av; el.querySelector('em').textContent = c.info.name;
  el.onclick = () => {
    if (el.classList.contains('wait')) return;
    el.classList.add('wait'); c.send({ type: 'pair' }); toast('ส่งคำขอไปที่ ' + c.info.name + ' แล้ว');
    setTimeout(() => el.classList.remove('wait'), 30000);
  };
  $('#peers').append(el); peers[c.peer] = { c, el }; lay();
}
function lay() {
  const k = Object.values(peers);
  k.forEach((p, i) => {
    const a = i / k.length * 2 * Math.PI - Math.PI / 2;
    p.el.style.setProperty('--x', 50 + 38 * Math.cos(a) + '%'); p.el.style.setProperty('--y', 50 + 38 * Math.sin(a) + '%');
    p.el.style.animationDelay = p.el.firstChild.style.animationDelay = (i * -0.7) + 's';
  });
  if (mode === 'near' && peer) msg(k.length ? 'แตะที่เพื่อนเพื่อขอเชื่อมต่อ' : 'ยังไม่พบใคร เปิดหน้านี้บนอีกเครื่องที่ใช้ Wi-Fi เดียวกัน');
}

/* ---------- โหมด QR Code ---------- */
function host() {
  stop(); mode = 'qrhost';
  const code = Array.from(crypto.getRandomValues(new Uint8Array(6)), x => ALPHA[x % ALPHA.length]).join('');
  const p = peer = new Peer('pxfer-v2-' + code);
  p.on('open', () => {
    const q = qrcode(0, 'M'); q.addData(location.origin + location.pathname + '?room=' + code); q.make();
    $('#h-qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    $('#h-code').textContent = code; $('#qr-home').hidden = true; $('#qr-host').hidden = false;
  });
  p.on('connection', c => {
    if (active || (hostConn && hostConn.open)) { c.on('open', () => c.close()); return; }
    hostConn = c; wire(c);
  });
  p.on('error', e => e.type === 'unavailable-id' ? host() : toast('ผิดพลาด: ' + e.type));
}
function join(code) {
  code = (code || '').trim().toUpperCase();
  if (code.length !== 6) { toast('รหัสห้องต้องมี 6 ตัวอักษร'); return; }
  stop(); mode = 'qrjoin';
  const p = peer = new Peer();
  p.on('open', () => wire(p.connect('pxfer-v2-' + code, { reliable: true })));
  p.on('error', e => toast(e.type === 'peer-unavailable' ? 'ไม่พบห้องนี้ ตรวจรหัสอีกครั้ง' : 'ผิดพลาด: ' + e.type));
}

/* ---------- การเชื่อมต่อ ---------- */
function wire(c) {
  c.on('open', () => c.send({ type: 'hello', name: me.name, av: me.av }));
  c.on('data', m => onData(c, m));
  c.on('close', () => gone(c)); c.on('error', () => gone(c));
}
function gone(c) {
  const p = peers[c.peer];
  if (p && p.c === c) { p.el.remove(); delete peers[c.peer]; lay(); }
  if (c === active) { $('#l-dot').classList.remove('on'); $('#l-st').textContent = 'การเชื่อมต่อหลุด'; toast('การเชื่อมต่อหลุด'); }
}
function onData(c, m) {
  if (!m || !m.type) return;
  if (m.type === 'hello') {
    c.info = { name: String(m.name || 'อุปกรณ์').slice(0, 24), av: String(m.av || '📱').slice(0, 4) };
    if (mode === 'qrhost' && !active) { c.send({ type: 'paired' }); enter(c); }
    else if (mode === 'near' && !active) addBubble(c);
  } else if (m.type === 'pair') {
    if (mode !== 'near' || active || !c.info) return;
    ask(c.info.av + ' ' + c.info.name, 'ต้องการเชื่อมต่อเพื่อส่งไฟล์กับเครื่องนี้', 'รับ', 'ไม่รับ').then(ok => {
      if (ok && !active) { c.send({ type: 'paired' }); enter(c); } else c.send({ type: 'declined' });
    });
  } else if (m.type === 'paired') { if (!active) enter(c); }
  else if (m.type === 'declined') { const p = peers[c.peer]; if (p) p.el.classList.remove('wait'); toast('อีกเครื่องไม่รับการเชื่อมต่อ'); }
  else if (c === active) transfer(m);
}
function enter(c) {
  active = c; clearInterval(scanT);
  Object.values(conns).concat(Object.values(peers).map(p => p.c)).forEach(x => { if (x !== c) try { x.close(); } catch {} });
  c.info = c.info || { name: 'อีกเครื่อง', av: '📱' };
  $('#l-av').textContent = c.info.av; $('#l-name').textContent = c.info.name;
  $('#l-dot').classList.add('on'); $('#l-st').textContent = 'เชื่อมต่อแล้ว';
  show('link'); keepAwake(); burst();
}

/* ---------- ส่ง/รับไฟล์ ---------- */
function item(icon, name, size, text) {
  const d = document.createElement('div'); d.className = 'item';
  d.innerHTML = '<b></b><div class="n"><span></span><span></span></div><div class="bar"><i></i></div><div class="st"></div><div class="act"></div>';
  d.children[0].textContent = icon; const n = d.querySelectorAll('.n span'); n[0].textContent = name; n[1].textContent = size;
  d.querySelector('.st').textContent = text; $('#list').prepend(d);
  return { fill: d.querySelector('i'), st: d.querySelector('.st'), act: d.querySelector('.act') };
}
const prog = (u, r, t) => { if (r != null) u.fill.style.width = Math.round(r * 100) + '%'; u.st.textContent = t; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function queue(files) {
  if (!active || !active.open) { toast('ยังไม่ได้เชื่อมต่อ'); return; }
  [...files].forEach(f => {
    const id = uid(); out[id] = { f, u: item('⬆️', f.name, fmt(f.size), 'รออีกเครื่องกดรับ…') };
    active.send({ type: 'offer', id, name: f.name, size: f.size });
  });
}
async function stream(id) {
  const o = out[id]; if (!o) return; let off = 0;
  try {
    while (off < o.f.size) {
      if (!active.open) throw 0;
      const buf = await o.f.slice(off, off + CHUNK).arrayBuffer();
      while (active.dataChannel && active.dataChannel.bufferedAmount > MAXBUF) await sleep(25);
      active.send({ type: 'chunk', id, data: buf }); off += buf.byteLength;
      prog(o.u, off / o.f.size, 'กำลังส่ง ' + Math.round(off / o.f.size * 100) + '%');
    }
    active.send({ type: 'done', id }); prog(o.u, 1, 'ส่งเสร็จแล้ว ✓'); burst();
  } catch { prog(o.u, null, 'ส่งไม่สำเร็จ'); }
}
function transfer(m) {
  if (m.type === 'offer') {
    const u = item('⬇️', m.name, fmt(m.size), 'มีไฟล์ส่งมา ต้องการรับไหม?');
    inc[m.id] = { name: m.name, size: m.size, parts: [], got: 0, u };
    const y = document.createElement('button'), n = document.createElement('button');
    y.className = 'y'; y.textContent = 'รับไฟล์'; n.textContent = 'ไม่รับ';
    y.onclick = () => { u.act.textContent = ''; prog(u, 0, 'กำลังรับ 0%'); active.send({ type: 'accept', id: m.id }); };
    n.onclick = () => { u.act.textContent = ''; prog(u, null, 'ไม่รับไฟล์นี้'); delete inc[m.id]; active.send({ type: 'decline', id: m.id }); };
    u.act.append(y, n);
  } else if (m.type === 'accept') stream(m.id);
  else if (m.type === 'decline') { if (out[m.id]) prog(out[m.id].u, null, 'อีกเครื่องไม่รับไฟล์นี้'); }
  else if (m.type === 'chunk') {
    const r = inc[m.id]; if (!r) return;
    r.parts.push(m.data); r.got += m.data.byteLength;
    prog(r.u, r.got / r.size, 'กำลังรับ ' + Math.round(r.got / r.size * 100) + '%');
  } else if (m.type === 'done') {
    const r = inc[m.id]; if (!r) return;
    const a = document.createElement('a'); a.className = 'y'; a.textContent = 'บันทึกไฟล์'; a.download = r.name;
    a.href = URL.createObjectURL(new Blob(r.parts)); r.parts = []; r.u.act.append(a);
    prog(r.u, 1, 'รับเสร็จแล้ว ✓'); burst();
  }
}

/* ---------- ผูกเหตุการณ์ ---------- */
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => tab(b.dataset.t));
$('#b-host').onclick = host;
$('#b-join').onclick = () => join($('#code').value);
$('#code').onkeydown = e => { if (e.key === 'Enter') join(e.target.value); };
$('#bye').onclick = () => { try { active.close(); } catch {} location.href = location.pathname; };
$('#me').onclick = async () => {
  const v = await ask('ชื่อเครื่องนี้', 'อีกเครื่องจะเห็นชื่อนี้ในหน้า "ใกล้ฉัน"', 'บันทึก', 'ยกเลิก', me.name);
  if (v) { me.name = v.slice(0, 20); save(); paintMe(); }
};
const drop = $('#drop'), fi = $('#file');
fi.onchange = () => { queue(fi.files); fi.value = ''; };
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => queue(e.dataTransfer.files));
addEventListener('beforeunload', e => { if (active && active.open) { e.preventDefault(); e.returnValue = ''; } });

paintMe();
const room = new URLSearchParams(location.search).get('room');
if (room) { tab('qr'); join(room); } else tab('near');
})();
</script>
