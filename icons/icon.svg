<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#311059" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Signal Waves (AirDrop effect) behind cat -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M 176 110 A 120 120 0 0 1 336 110" />
    <path d="M 140 80 A 160 160 0 0 1 372 80" />
    <path d="M 104 50 A 200 200 0 0 1 408 50" />
  </g>

  <!-- Cat Container with shadow -->
  <g filter="url(#shadow)">
    <!-- Left Ear -->
    <path d="M 140 250 L 120 140 C 120 130 135 125 145 135 L 210 200 Z" fill="url(#catGrad)"/>
    <path d="M 145 230 L 132 152 C 132 147 141 144 146 149 L 195 198 Z" fill="url(#earPink)"/>

    <!-- Right Ear -->
    <path d="M 372 250 L 392 140 C 392 130 377 125 367 135 L 302 200 Z" fill="url(#catGrad)"/>
    <path d="M 367 230 L 380 152 C 380 147 371 144 366 149 L 317 198 Z" fill="url(#earPink)"/>

    <!-- Cat Head & Body -->
    <ellipse cx="256" cy="275" rx="140" ry="115" fill="url(#catGrad)"/>
    <path d="M 150 360 Q 256 340 362 360 L 385 450 Q 256 465 127 450 Z" fill="url(#catGrad)"/>

    <!-- Whiskers -->
    <g stroke="#9ca3af" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <!-- Left Whiskers -->
      <line x1="120" y1="285" x2="195" y2="280" />
      <line x1="115" y1="305" x2="192" y2="295" />
      <line x1="125" y1="325" x2="195" y2="310" />
      <!-- Right Whiskers -->
      <line x1="392" y1="285" x2="317" y2="280" />
      <line x1="397" y1="305" x2="320" y2="295" />
      <line x1="387" y1="325" x2="317" y2="310" />
    </g>

    <!-- Eyes -->
    <g fill="#1e1b4b">
      <!-- Left Eye -->
      <ellipse cx="195" cy="255" rx="18" ry="24"/>
      <!-- Right Eye -->
      <ellipse cx="317" cy="255" rx="18" ry="24"/>
    </g>
    <!-- Eye Highlights -->
    <g fill="#ffffff">
      <ellipse cx="190" cy="247" rx="7" ry="9"/>
      <ellipse cx="201" cy="263" rx="3.5" ry="4.5"/>
      <ellipse cx="312" cy="247" rx="7" ry="9"/>
      <ellipse cx="323" cy="263" rx="3.5" ry="4.5"/>
    </g>

    <!-- Cute Blush Cheeks -->
    <ellipse cx="160" cy="285" rx="18" ry="10" fill="#fca5a5" opacity="0.6"/>
    <ellipse cx="352" cy="285" rx="18" ry="10" fill="#fca5a5" opacity="0.6"/>

    <!-- Cute Nose -->
    <path d="M 256 276 L 246 265 C 243 262 269 262 266 265 Z" fill="#f43f5e"/>

    <!-- Mouth -->
    <path d="M 246 280 Q 256 288 256 283 Q 256 288 266 280" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Cat Paw Badge in Chest with wireless symbol -->
    <g transform="translate(256, 395) scale(0.9)">
      <circle cx="0" cy="0" r="42" fill="#8b5cf6" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="38" fill="#7c3aed"/>
      <!-- Main Paw Pad -->
      <ellipse cx="0" cy="8" rx="18" ry="14" fill="#ffffff"/>
      <!-- 4 Paw Toe Pads -->
      <ellipse cx="-16" cy="-10" rx="6" ry="8" fill="#ffffff" transform="rotate(-15, -16, -10)"/>
      <ellipse cx="-6" cy="-18" rx="6.5" ry="9" fill="#ffffff" transform="rotate(-5, -6, -18)"/>
      <ellipse cx="6" cy="-18" rx="6.5" ry="9" fill="#ffffff" transform="rotate(5, 6, -18)"/>
      <ellipse cx="16" cy="-10" rx="6" ry="8" fill="#ffffff" transform="rotate(15, 16, -10)"/>
    </g>
  </g>
</svg>
